name: awtserver CLI prototype

on:
  push:
    paths:
      - "awtserver"
      - "awtserver.py"
      - "awtserver_cron.py"
      - "awtserver_tui.py"
      - "awtserver_docs.py"
      - "awtserver_installer.py"
      - "tests/test_awtserver*.py"
      - "docs/quick/**"
      - "docs/awtserver-cli.md"
      - ".github/workflows/awtserver-cli.yml"
  pull_request:
    paths:
      - "awtserver"
      - "awtserver.py"
      - "awtserver_cron.py"
      - "awtserver_tui.py"
      - "awtserver_docs.py"
      - "awtserver_installer.py"
      - "tests/test_awtserver*.py"
      - "docs/quick/**"
      - "docs/awtserver-cli.md"
      - ".github/workflows/awtserver-cli.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and unit tests
        run: |
          python3 -m py_compile awtserver awtserver.py awtserver_cron.py awtserver_tui.py awtserver_docs.py awtserver_installer.py tests/test_awtserver*.py
          python3 -m unittest discover -s tests -p 'test_awtserver*.py' -v
          python3 awtserver docs
          python3 awtserver docs remote-apps
          python3 awtserver installer
          python3 awtserver.py profiles
          python3 awtserver.py plan
          python3 awtserver.py install --profiles base storage

  debian13-package-resolution:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Verify package names and dependencies using Debian Stable
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-remove --no-install-recommends python3
          python3 - <<'PY'
          from awtserver import PROFILES, packages_for
          from subprocess import run
          from pathlib import Path
          assert Path("/etc/os-release").read_text().find("VERSION_ID=\"13\"") >= 0
          for name in sorted(PROFILES):
              packages = packages_for([name])
              print(f"Checking profile {name}: {packages}", flush=True)
              run(["apt-get", "--simulate", "--no-remove", "install", *packages], check=True)
          PY
