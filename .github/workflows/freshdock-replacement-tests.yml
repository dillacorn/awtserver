name: Freshdock replacement safety

on:
  pull_request:
    paths:
      - 'docker/freshdock/**'
      - 'tests/test_freshdock_replacement.py'
      - 'docker/freshdock/audit_enrollment.py'
      - 'tests/test_freshdock_enrollment_audit.py'
      - 'docker/freshdock/enroll_services_verified.py'
      - 'docker/freshdock/diagnose_tailscale_serve.py'
      - 'tests/test_freshdock_privacy_enrollment.py'
      - 'tests/test_freshdock_verified_enrollment.py'
      - 'docker/freshdock/smtp_smoke_test.py'
      - '.github/workflows/freshdock-replacement-tests.yml'
  push:
    branches: [main]
    paths:
      - 'docker/freshdock/**'
      - 'tests/test_freshdock_replacement.py'
      - 'docker/freshdock/audit_enrollment.py'
      - 'tests/test_freshdock_enrollment_audit.py'
      - 'docker/freshdock/enroll_services_verified.py'
      - 'docker/freshdock/diagnose_tailscale_serve.py'
      - 'tests/test_freshdock_privacy_enrollment.py'
      - 'tests/test_freshdock_verified_enrollment.py'
      - 'docker/freshdock/smtp_smoke_test.py'
      - '.github/workflows/freshdock-replacement-tests.yml'

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile docker/freshdock/replace_wud_daemon.py docker/freshdock/enroll_services.py docker/freshdock/audit_enrollment.py docker/freshdock/enroll_services_verified.py docker/freshdock/diagnose_tailscale_serve.py docker/freshdock/enroll_privacy_stack.py docker/freshdock/smtp_smoke_test.py tests/test_freshdock_verified_enrollment.py tests/test_freshdock_replacement.py tests/test_freshdock_enrollment_audit.py
      - name: Safeguard tests
        run: python3 -m unittest discover -s tests -p 'test_freshdock_replacement.py' -v
      - name: Audit test suite
        run: python3 -m unittest discover -s tests -p 'test_freshdock_enrollment_audit.py' -v
      - name: Verified enrollment safety tests
        run: python3 -m unittest discover -s tests -p 'test_freshdock_verified_enrollment.py' -v
      - name: Privacy stack enrollment safety tests
        run: python3 -m unittest discover -s tests -p 'test_freshdock_privacy_enrollment.py' -v
      - name: Validate pinned upstream shared-network hotfix applies
        run: |
          git clone --quiet https://github.com/Turbootzz/freshdock.git "$RUNNER_TEMP/freshdock-upstream"
          git -C "$RUNNER_TEMP/freshdock-upstream" checkout --quiet d61b38d295d9bca4be9b0c9fd9d68624a731cb13
          git -C "$RUNNER_TEMP/freshdock-upstream" apply --check "$GITHUB_WORKSPACE/docker/freshdock/upstream-shared-network-recreate.patch"
      - name: Validate Freshdock Compose syntax
        run: docker compose -f docker/freshdock/compose.yml config --quiet
