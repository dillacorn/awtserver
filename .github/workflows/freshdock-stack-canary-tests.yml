name: Freshdock stack canary tests

on:
  pull_request:
    paths:
      - 'docker/freshdock/**'
      - 'tests/test_freshdock_stack_canary.py'
      - 'tests/test_freshdock_auto_canary.py'
      - '.github/workflows/freshdock-stack-canary-tests.yml'
  push:
    branches: [main]
    paths:
      - 'docker/freshdock/**'
      - 'tests/test_freshdock_stack_canary.py'
      - 'tests/test_freshdock_auto_canary.py'
      - '.github/workflows/freshdock-stack-canary-tests.yml'

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: python3 -m py_compile docker/freshdock/*.py tests/test_freshdock_*canary.py
      - name: Validate preflight and isolated network configuration
        run: python3 -m unittest discover -s tests -p 'test_freshdock_*canary.py' -v
