name: Watchtower fork replacement checks

on:
  pull_request:
    paths:
      - 'docker/watchtower/**'
      - 'tests/watchtower_fork_*'
      - 'tests/test_watchtower_fork_*'
      - 'docker/privacy/compose.transmission-brother.yml'
      - 'docker/privacy/migrate_trawl.py'
      - 'tests/test_trawl_migration.py'
      - 'tests/test_watchtower_verifier.py'
      - '.github/workflows/watchtower-fork-tests.yml'
  push:
    branches: [main]
    paths:
      - 'docker/watchtower/**'
      - 'tests/watchtower_fork_*'
      - 'tests/test_watchtower_fork_*'
      - 'docker/privacy/compose.transmission-brother.yml'
      - 'docker/privacy/migrate_trawl.py'
      - 'tests/test_trawl_migration.py'
      - 'tests/test_watchtower_verifier.py'
      - '.github/workflows/watchtower-fork-tests.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile docker/watchtower/*.py docker/privacy/migrate_trawl.py tests/watchtower_fork_*.py
          python3 -m unittest discover -s tests -p 'test_watchtower*.py' -v
          python3 -m unittest discover -s tests -p 'test_trawl_migration.py' -v
          docker compose -f docker/watchtower/compose.yml config --quiet
          mkdir -p docker/privacy/transmission-brother
          printf 'USER=testuser\nPASS=testpass\n' > docker/privacy/transmission-brother/auth.env
          TRANSMISSION_BROTHER_PEER_PORT=25046 docker compose \
            -f docker/privacy/compose.yml \
            -f docker/privacy/compose.transmission-brother.yml \
            config --quiet
          systemd-analyze calendar '*-*-* 05:00:00 America/New_York'
  live-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Real v1.23.1 child and parent namespace tests
        run: python3 tests/watchtower_fork_live.py

  live-gluetun:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Real Gluetun no-tunnel firewall and dependency update
        run: python3 tests/watchtower_fork_gluetun_live.py
