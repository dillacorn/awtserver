name: WUD migration validation

on:
  pull_request:
    paths:
      - 'docker/wud/**'
      - 'docker/watchtower/**'
      - '.github/workflows/wud-migration-tests.yml'
  push:
    branches: [main]
    paths:
      - 'docker/wud/**'
      - 'docker/watchtower/**'
      - '.github/workflows/wud-migration-tests.yml'

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n docker/wud/migrate-watchtower-to-wud.sh
      - name: Validate production Compose
        env:
          WUD_WATCHER_LOCAL_INCLUDE: '^(?:brave|tailscale-brave)$'
          WUD_SMTP_FROM: example@example.org
          WUD_SMTP_TO: recipient@example.org
          WUD_SMTP_HOST: localhost
          WUD_SMTP_PORT: '587'
          WUD_SMTP_USER: example
          WUD_SMTP_PASS: fake-ci-password
        run: docker compose -f docker/wud/compose_example.yml config --quiet
      - name: Check updater gates and excluded infrastructure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          example = Path("docker/wud/compose_example.yml").read_text()
          script = Path("docker/wud/migrate-watchtower-to-wud.sh").read_text()
          assert "getwud/wud:9.4.1" in example
          assert '/var/run/docker.sock:/var/run/docker.sock' in example
          assert 'WUD_SERVER_ENABLED: "false"' in example
          assert 'WUD_WATCHER_LOCAL_WATCHATSTART: "false"' in example
          assert 'WUD_WATCHER_LOCAL_WATCHEVENTS: "false"' in example
          assert 'WUD_TRIGGER_DOCKER_UPDATES_AUTO: "true"' in example
          assert 'WUD_TRIGGER_DOCKER_UPDATES_ROLLBACK: "true"' in example
          assert 'WUD_TRIGGER_DOCKER_UPDATES_SELFUPDATE: "false"' in example
          assert 'WUD_TRIGGER_SMTP_LEGACY_AUTO: "true"' in example
          assert "pihole|dnsproxy-quad9|nginx-pihole" in example
          assert "watchtower|wud" in example
          assert "cmd[3:] != expected" in script
          assert 'docker stop --time 30 watchtower' in script
          assert 'docker rm watchtower' in script
          assert 'docker compose up -d --no-deps wud' in script
          assert 'docker compose -f compose.yml up -d --no-deps watchtower' in script
          assert 'wud.watch' in script
          assert "before-wud" in script
          for secret in ("eWT1Hdd6Tx13d2", "dillacorncalibre@gmx.com", "dillacorn@proton.me"):
              assert secret not in example
              assert secret not in script
          print("WUD replacement safety checks passed")
          PY
