# Freshdock v1.7.1 replacement for WUD on openmediavault.
# No unlabelled containers are opted in and no ports are exposed.
services:
  freshdock:
    image: ghcr.io/turbootzz/freshdock:1.7.1
    container_name: freshdock
    command: ["run", "--interval", "300", "--tick", "60"]
    restart: unless-stopped
    environment:
      TZ: America/New_York
      FRESHDOCK_WATCH_ALL: "false"
      FRESHDOCK_DEFAULT_MODE: "watch"
      FRESHDOCK_COMPOSE_AWARE: "true"
      FRESHDOCK_CLEANUP: "false"
      FRESHDOCK_PRUNE_DANGLING: "false"
      FRESHDOCK_CONFIG: /config/freshdock.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./freshdock.toml:/config/freshdock.toml:ro
    labels:
      freshdock.enable: "false"
