services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    environment:
      TZ: America/New_York
      FTLCONF_webserver_api_password: 'REPLACE_WITH_YOUR_PASSWORD'
      FTLCONF_dns_upstreams: 127.0.0.1#5053
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_hosts: |-
        192.168.1.10 omv.example-tailnet.ts.net
        192.168.1.10 flame.example-tailnet.ts.net
        192.168.1.10 freshrss.example-tailnet.ts.net
        192.168.1.10 jellyfin.example-tailnet.ts.net
        192.168.1.10 navidrome.example-tailnet.ts.net
        192.168.1.10 seerr.example-tailnet.ts.net
        192.168.1.10 karakeep.example-tailnet.ts.net
        192.168.1.10 audiobookshelf.example-tailnet.ts.net
        192.168.1.10 ntfy.example-tailnet.ts.net
        192.168.1.10 obico.example-tailnet.ts.net
        192.168.1.10 immich.example-tailnet.ts.net
        192.168.1.10 vaultwarden.example-tailnet.ts.net
        192.168.1.10 mullvad.example-tailnet.ts.net
        192.168.1.10 transmission.example-tailnet.ts.net
        192.168.1.10 amutorrent.example-tailnet.ts.net
        192.168.1.10 dockge.example-tailnet.ts.net
        192.168.1.10 owncast.example-tailnet.ts.net
      PIHOLE_UID: "1000"
      PIHOLE_GID: "1000"
    ports:
      - "192.168.1.10:53:53/tcp"
      - "192.168.1.10:53:53/udp"
      - "8088:80/tcp"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped

  dnsproxy:
    image: adguard/dnsproxy:latest
    container_name: dnsproxy
    network_mode: "service:pihole"
    command:
      - "--listen=127.0.0.1"
      - "--port=5053"
      # Recommended/default upstream: Quad9 encrypted DoH.
      # Pi-hole remains the filtering and per-client policy layer.
      - "--upstream=https://dns.quad9.net/dns-query"
      - "--bootstrap=9.9.9.9:53"
      - "--bootstrap=149.112.112.112:53"
      - "--bootstrap=2620:fe::fe:53"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-pihole
    depends_on:
      - pihole
    ports:
      - "192.168.1.10:443:443/tcp"
      - "8089:8089/tcp"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - /docker/tailscale-certs:/etc/nginx/omv-certs:ro
      - /docker/flame/ts/state/certs:/etc/nginx/flame-certs:ro
      - /docker/freshrss/ts/state/certs:/etc/nginx/freshrss-certs:ro
      - /docker/jellyfin/ts/state/certs:/etc/nginx/jellyfin-certs:ro
      - /docker/navidrome/ts/state/certs:/etc/nginx/navidrome-certs:ro
      # Clean install. Migrated servers may retain the old volume mapping:
      # /docker/jellyseerr/ts/state/certs:/etc/nginx/jellyseerr-certs:ro
      # Never overwrite the live Pi-hole Compose configuration with this example.
      - /docker/seerr/ts/state/certs:/etc/nginx/seerr-certs:ro
      - /docker/karakeep/ts/state/certs:/etc/nginx/karakeep-certs:ro
      - /docker/audiobookshelf/ts/state/certs:/etc/nginx/audiobookshelf-certs:ro
      - /docker/ntfy/ts/state/certs:/etc/nginx/ntfy-certs:ro
      - /docker/immich/ts/state/certs:/etc/nginx/immich-certs:ro
      - /docker/vaultwarden/ts/state/certs:/etc/nginx/vaultwarden-certs:ro
      - /docker/privacy/ts/mullvad/state/certs:/etc/nginx/mullvad-certs:ro
      - /docker/privacy/ts/transmission/state/certs:/etc/nginx/transmission-certs:ro
      # Optional aMuTorrent local HTTPS certificate mount; verify the sidecar path first.
      - /docker/privacy/ts/amutorrent/state/certs:/etc/nginx/amutorrent-certs:ro
      - /docker/dockge/ts/state/certs:/etc/nginx/dockge-certs:ro
      - /docker/obico/ts/state/certs:/etc/nginx/obico-certs:ro
      - /docker/owncast/ts/state/certs:/etc/nginx/owncast-certs:ro
    networks:
      - default
      - local-webapps
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/tmp

networks:
  default:
  local-webapps:
    external: true
    name: local-webapps
