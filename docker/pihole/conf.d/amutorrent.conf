# Replace example-tailnet.ts.net with the actual MagicDNS suffix on the host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name amutorrent.example-tailnet.ts.net;

    ssl_certificate     /etc/nginx/amutorrent-certs/amutorrent.example-tailnet.ts.net.crt;
    ssl_certificate_key /etc/nginx/amutorrent-certs/amutorrent.example-tailnet.ts.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        set $local_backend "http://gluetun:4000";
        proxy_pass $local_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
    }
}
