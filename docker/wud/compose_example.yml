# Full Watchtower replacement. No WUD HTTP/API service exposed.
# A guarded installer generates .env privately on the OMV host.
services:
  wud:
    image: getwud/wud:9.4.1
    container_name: wud
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./store:/store
    environment:
      TZ: America/New_York
      WUD_LOG_LEVEL: info
      WUD_SERVER_ENABLED: "false"
      # Mandatory in WUD 9.x, even with HTTP disabled; randomly generated locally.
      WUD_AUTH_ADMIN_USER: "admin"
      WUD_AUTH_ADMIN_PASSWORD: "${WUD_AUTH_ADMIN_PASSWORD:?missing_local_admin_password}"
      # Strict anchored name allowlist generated from live Watchtower arguments.
      WUD_WATCHER_LOCAL_INCLUDE: "${WUD_WATCHER_LOCAL_INCLUDE:?missing_name_allowlist}"
      WUD_WATCHER_LOCAL_EXCLUDE: "^(pihole|dnsproxy-quad9|nginx-pihole|watchtower|wud)$"
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "false"
      WUD_WATCHER_LOCAL_CRON: "45 2 * * *"
      WUD_WATCHER_LOCAL_WATCHATSTART: "false"
      WUD_WATCHER_LOCAL_WATCHEVENTS: "false"
      WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT: "true"
      # Auto-update on discovery, 02:45 daily. Startup and Docker events are disabled.
      WUD_TRIGGER_DOCKER_UPDATES_AUTO: "true"
      WUD_TRIGGER_DOCKER_UPDATES_EVENTS: "available"
      WUD_TRIGGER_DOCKER_UPDATES_ROLLBACK: "true"
      WUD_TRIGGER_DOCKER_UPDATES_ROLLBACKWINDOW: "300000"
      WUD_TRIGGER_DOCKER_UPDATES_ROLLBACKGRACE: "15000"
      WUD_TRIGGER_DOCKER_UPDATES_PRUNE: "false"
      WUD_TRIGGER_DOCKER_UPDATES_SELFUPDATE: "false"
      # Keep SMTP credentials out of the public repo (read from local .env).
      WUD_TRIGGER_SMTP_LEGACY_AUTO: "true"
      WUD_TRIGGER_SMTP_LEGACY_EVENTS: "success,failure,rollback"
      WUD_TRIGGER_SMTP_LEGACY_HOST: "${WUD_SMTP_HOST:?missing_smtp_host}"
      WUD_TRIGGER_SMTP_LEGACY_PORT: "${WUD_SMTP_PORT:?missing_smtp_port}"
      WUD_TRIGGER_SMTP_LEGACY_USER: "${WUD_SMTP_USER:?missing_smtp_user}"
      WUD_TRIGGER_SMTP_LEGACY_PASS: "${WUD_SMTP_PASS:?missing_smtp_password}"
      WUD_TRIGGER_SMTP_LEGACY_FROM_ADDRESS: "${WUD_SMTP_FROM:?missing_smtp_from}"
      WUD_TRIGGER_SMTP_LEGACY_TO: "${WUD_SMTP_TO:?missing_smtp_to}"
      WUD_TRIGGER_SMTP_LEGACY_TLS_ENABLED: "false"
      WUD_TRIGGER_SMTP_LEGACY_TLS_VERIFY: "true"
    labels:
      wud.watch: "false"
      wud.trigger.exclude: "true"
